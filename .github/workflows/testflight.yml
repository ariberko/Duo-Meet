name: Upload to TestFlight

# Builds the real app on GitHub's Mac and uploads it to App Store Connect.
# Needs 3 repository secrets from an App Store Connect API key (Admin access):
#   ASC_KEY_ID      Key ID
#   ASC_ISSUER_ID   Issuer ID
#   ASC_KEY_P8      the full text of the downloaded AuthKey_XXXX.p8 file
# Run it from the Actions tab (once this file is on the default branch), push a tag that
# starts with "release-", or push a commit whose message contains "[testflight]".

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "release-*"

jobs:
  upload:
    if: >-
      github.event_name != 'push'
      || startsWith(github.ref, 'refs/tags/release-')
      || contains(github.event.head_commit.message, '[testflight]')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "Missing secret: $name"; missing=1; fi
          done
          exit $missing

      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Rebuild a clean PEM file: drop Windows line endings, spaces and the header lines,
          # then wrap the key body at 64 characters, so a messy paste still works.
          body=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed '/-----/d' | tr -d ' \t\n')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$body" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } > "$RUNNER_TEMP/keys/AuthKey.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/keys/AuthKey.p8" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a valid .p8 key. Open AuthKey_XXXX.p8 in Notepad, copy all of it and save the secret again."
            exit 1
          fi

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # The archive is left unsigned. The export step signs it once with Apple's
      # cloud-managed distribution certificate, so no new development
      # certificate is made on every run (Apple allows only a few).
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MeetingOS.xcodeproj \
            -scheme MeetingOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MeetingOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')" \
            -authenticationKeyIssuerID "$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=HKA3SA3729 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { ./scripts/report-errors.sh "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -n 100 "$RUNNER_TEMP/archive.log"
          find "$RUNNER_TEMP/MeetingOS.xcarchive" -maxdepth 4 | while read -r f; do echo "::notice::$f"; done
          grep -E "ARCHIVE|warning: .*sign|SKIP_INSTALL" "$RUNNER_TEMP/archive.log" | head -n 10 | while read -r f; do echo "::notice::$f"; done

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>HKA3SA3729</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MeetingOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')" \
            -authenticationKeyIssuerID "$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { ./scripts/report-errors.sh "$RUNNER_TEMP/export.log"; exit 1; }
          tail -n 100 "$RUNNER_TEMP/export.log"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
