# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
# The app code lives in MeetingOS.swiftpm so the iPad Playgrounds app and the
# App Store app share one copy.
name: MeetingOS
options:
  bundleIdPrefix: com.ariberkowitz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: HKA3SA3729
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MeetingOS:
    type: application
    platform: iOS
    sources:
      # Point at the folders inside, not the .swiftpm folder itself:
      # Xcode would copy a ".swiftpm" folder in as a file instead of compiling it.
      - MeetingOS.swiftpm/App
      - MeetingOS.swiftpm/Sources
      - AppAssets/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariberkowitz.meetingos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: AppAssets/Info.plist
      properties:
        CFBundleDisplayName: MeetingOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  MeetingOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/MeetingOSTests
    dependencies:
      - target: MeetingOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariberkowitz.meetingos.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MeetingOS:
    build:
      targets:
        MeetingOS: all
    test:
      targets:
        - MeetingOSTests
    run:
      config: Debug
    archive:
      config: Release
